[package]
name = "pdfcraft"
version = "0.1.4"
description = "PDFCraft Desktop Application"
authors = ["PDFCraft"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
ureq = "2.9"
percent-encoding = "2.3"

[profile.release]
opt-level = 2
lto = "off"
codegen-units = 256
incremental = true
panic = "abort"

