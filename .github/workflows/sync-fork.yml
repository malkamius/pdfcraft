name: Fork Sync (Disabled)

permissions:
  contents: write

# Automatic sync is disabled to preserve custom fork changes.
# Upstream changes will be reviewed and merged intentionally using AI/manual PRs.
on:
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    # Disabled to prevent automatic upstream overwrites
    if: false

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: PDFCraftTool/pdfcraft
          upstream_sync_branch: main
          target_sync_branch: main
          test_mode: false

      - name: Check for new commits
        if: success()
        run: echo "Sync completed successfully"

      - name: Check for Failure
        if: failure()
        run: |
          echo "[Error] Sync failed. This might be due to:"
          echo "1. Changes in the upstream workflow file"
          echo "2. Merge conflicts that need manual resolution"
          echo "3. Network issues"
          echo "Please check the logs and consider manual sync if needed."
          exit 1
